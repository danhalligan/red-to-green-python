name: Python checks

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Stop `uv run` recreating the environment with the version in .python-version.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.5
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project and check dependencies
        run: uv sync --all-groups --extra science --frozen

      - name: Lint and check formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Collect tests
        run: uv run pytest --collect-only

      - name: Check documentation links
        run: uv run pytest tests/test_docs.py

      - name: Run scaffold and packaged-data tests
        run: uv run pytest tests/test_scaffold.py tests/test_data.py tests/test_spinning_plates_data.py

      - name: Smoke-test notebook setup cells
        run: uv run pytest tests/test_notebooks.py

      - name: Build distributions
        run: uv build

      - name: Load datasets from the built wheel
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/pyproblems-wheel" dist/pyproblems-0.1.0-py3-none-any.whl
          PYTHONPATH="$RUNNER_TEMP/pyproblems-wheel" python -c 'from pyproblems.data import load_sudoku_data, load_steak_toast_tea, load_xy_data, load_titanic_data; from importlib.resources import files; assert len(load_steak_toast_tea()) == 79; assert len(load_xy_data()) == 13; assert len(load_sudoku_data()) == 40; assert len(load_titanic_data()) == 1309; assert all(files("exercises.data_analysis.spinning_plates").joinpath("data", name).is_file() for name in ("plate_reader_export.txt", "plate_layout.csv", "plate_run_record.json"))'