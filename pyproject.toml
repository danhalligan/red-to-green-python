[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyproblems"
version = "0.1.0"
description = "Python exercises from FizzBuzz to mixture models: turn failing tests from red to green"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
science = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.12",
]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbmake>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["exercises"]

[tool.pytest.ini_options]
testpaths = ["tests", "exercises"]
addopts = "-ra"
markers = [
    "advanced: optional numerical modelling exercises",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Starter notebooks import what learners will need and may have long lines.
"analysis/*.ipynb" = ["E501", "F401"]
"exercises/**/*.ipynb" = ["E501", "F401"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"